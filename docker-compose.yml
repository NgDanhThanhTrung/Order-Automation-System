version: '3.8'

services:
  # Backend API Server
  backend:
    build:
      context: ./artifacts/api-server
      dockerfile: Dockerfile
    container_name: order-automation-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - LOG_LEVEL=info
    env_file:
      - artifacts/api-server/.env
    restart: unless-stopped
    networks:
      - order-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/api/healthz', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend Storefront
  frontend:
    build:
      context: ./artifacts/storefront
      dockerfile: Dockerfile
    container_name: order-automation-frontend
    ports:
      - "80:80"
    environment:
      - VITE_PUBLIC_API_URL=http://localhost:5000/api
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - order-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # Nginx Reverse Proxy (Optional - for production)
  nginx:
    image: nginx:alpine
    container_name: order-automation-nginx
    ports:
      - "443:443"
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks:
      - order-network
    profiles:
      - production

networks:
  order-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data: