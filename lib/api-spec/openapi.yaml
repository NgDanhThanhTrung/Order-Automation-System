openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 1.0.0
  description: Payment & Order Management System API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health check operations
  - name: products
    description: Product catalog
  - name: orders
    description: Order management
  - name: webhook
    description: SePay webhook receiver
  - name: reports
    description: Payment reports (admin only)

paths:
  # ─────────────────────────────────────────────
  # HEALTH
  # ─────────────────────────────────────────────
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server and database health status. Used by UptimeRobot to keep Render.com alive.
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: Degraded (DB unreachable)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─────────────────────────────────────────────
  # PRODUCTS
  # ─────────────────────────────────────────────
  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List active products
      responses:
        "200":
          description: List of active products
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductListResponse"

  /products/{id}:
    get:
      operationId: getProduct
      tags: [products]
      summary: Get product by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Product detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─────────────────────────────────────────────
  # ORDERS
  # ─────────────────────────────────────────────
  /orders:
    post:
      operationId: createOrder
      tags: [orders]
      summary: Create a new order
      description: Creates a pending order and returns a dynamic VietQR payment URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: Order created with VietQR URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateOrderResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get order detail
      description: Returns full order detail. Frontend polls this to detect payment.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetailResponse"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders/{id}/ship:
    patch:
      operationId: shipOrder
      tags: [orders]
      summary: Mark order as shipped (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: X-Telegram-Chat-Id
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order marked as shipped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "400":
          description: Order not in paid status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing admin header
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─────────────────────────────────────────────
  # WEBHOOK
  # ─────────────────────────────────────────────
  /webhook/sepay:
    post:
      operationId: sePayWebhook
      tags: [webhook]
      summary: SePay balance change webhook
      security:
        - sePayApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SePayWebhookPayload"
      responses:
        "200":
          description: Webhook processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookResponse"
        "401":
          description: Invalid or missing API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─────────────────────────────────────────────
  # REPORTS (admin only)
  # ─────────────────────────────────────────────
  /reports:
    get:
      operationId: listReports
      tags: [reports]
      summary: List payment reports (admin)
      parameters:
        - name: X-Telegram-Chat-Id
          in: header
          required: true
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: string
            default: "1"
        - name: limit
          in: query
          schema:
            type: string
            default: "20"
      responses:
        "200":
          description: Paginated list of payment reports
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportListResponse"
        "401":
          description: Missing admin header
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /reports/orders:
    get:
      operationId: listOrdersAdmin
      tags: [reports]
      summary: List all orders for admin dashboard
      parameters:
        - name: X-Telegram-Chat-Id
          in: header
          required: true
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: string
            default: "1"
        - name: limit
          in: query
          schema:
            type: string
            default: "20"
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, paid, shipped, cancelled]
      responses:
        "200":
          description: Paginated order list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetailListResponse"
        "401":
          description: Missing admin header
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /reports/order/{orderId}:
    get:
      operationId: getOrderReports
      tags: [reports]
      summary: Get payment reports for an order
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
        - name: X-Telegram-Chat-Id
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Reports for the order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportListResponse"
        "404":
          description: No reports found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

# ─────────────────────────────────────────────
# COMPONENTS
# ─────────────────────────────────────────────
components:
  securitySchemes:
    sePayApiKey:
      type: apiKey
      in: header
      name: Authorization
      description: "Format: Apikey <token>"

  schemas:
    # ── Health ──
    HealthStatus:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded]
        timestamp:
          type: string
        uptime:
          type: number
        latencyMs:
          type: number
        services:
          type: object
          properties:
            database:
              type: object
              properties:
                status:
                  type: string
                  enum: [ok, error]
                latencyMs:
                  type: number
                  nullable: true
        version:
          type: string
      required: [status, timestamp, uptime, latencyMs, services, version]

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          enum: [false]
        error:
          type: string
        message:
          type: string
      required: [success, error, message]

    # ── Product ──
    Product:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        price:
          type: number
          description: Price in VND
        image_url:
          type: string
          nullable: true
        stock_quantity:
          type: number
        is_active:
          type: boolean
        created_at:
          type: string
        updated_at:
          type: string
      required: [id, name, price, stock_quantity, is_active, created_at, updated_at]

    ProductListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: "#/components/schemas/Product"
      required: [success, data]

    ProductResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/Product"
      required: [success, data]

    # ── Order ──
    OrderStatus:
      type: string
      enum: [pending, paid, shipped, cancelled]

    Order:
      type: object
      properties:
        id:
          type: string
        order_code:
          type: string
        product_id:
          type: string
        quantity:
          type: number
        total_amount:
          type: number
        customer_name:
          type: string
          nullable: true
        customer_email:
          type: string
          nullable: true
        customer_phone:
          type: string
          nullable: true
        customer_note:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/OrderStatus"
        payment_content:
          type: string
          nullable: true
        paid_at:
          type: string
          nullable: true
        shipped_at:
          type: string
          nullable: true
        cancelled_at:
          type: string
          nullable: true
        expires_at:
          type: string
        telegram_message_id:
          type: number
          nullable: true
        created_at:
          type: string
        updated_at:
          type: string
      required:
        - id
        - order_code
        - product_id
        - quantity
        - total_amount
        - status
        - expires_at
        - created_at
        - updated_at

    OrderDetail:
      type: object
      properties:
        order_id:
          type: string
        order_code:
          type: string
        order_status:
          $ref: "#/components/schemas/OrderStatus"
        total_amount:
          type: number
        quantity:
          type: number
        customer_name:
          type: string
          nullable: true
        customer_email:
          type: string
          nullable: true
        customer_phone:
          type: string
          nullable: true
        payment_content:
          type: string
          nullable: true
        paid_at:
          type: string
          nullable: true
        shipped_at:
          type: string
          nullable: true
        cancelled_at:
          type: string
          nullable: true
        expires_at:
          type: string
        order_created_at:
          type: string
        product_id:
          type: string
        product_name:
          type: string
        product_price:
          type: number
        transaction_id:
          type: string
          nullable: true
        sepay_transaction_id:
          type: number
          nullable: true
        paid_amount:
          type: number
          nullable: true
        transaction_date:
          type: string
          nullable: true
        bank_brand_name:
          type: string
          nullable: true
        transaction_status:
          type: string
          enum: [matched, unmatched, duplicate]
          nullable: true
        report_id:
          type: string
          nullable: true
        bill_image_url:
          type: string
          nullable: true
        report_created_at:
          type: string
          nullable: true
      required:
        - order_id
        - order_code
        - order_status
        - total_amount
        - quantity
        - expires_at
        - order_created_at
        - product_id
        - product_name
        - product_price

    CreateOrderRequest:
      type: object
      properties:
        product_id:
          type: string
        quantity:
          type: number
          minimum: 1
          maximum: 100
          default: 1
        customer_name:
          type: string
        customer_email:
          type: string
        customer_phone:
          type: string
        customer_note:
          type: string
      required: [product_id]

    CreateOrderResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            order:
              $ref: "#/components/schemas/Order"
            product:
              type: object
              properties:
                id:
                  type: string
                name:
                  type: string
                price:
                  type: number
                image_url:
                  type: string
                  nullable: true
              required: [id, name, price]
            qr_code_url:
              type: string
              description: VietQR image URL for payment
          required: [order, product, qr_code_url]
      required: [success, data]

    OrderResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/Order"
      required: [success, data]

    OrderDetailResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/OrderDetail"
      required: [success, data]

    OrderDetailListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: "#/components/schemas/OrderDetail"
        pagination:
          $ref: "#/components/schemas/Pagination"
      required: [success, data, pagination]

    # ── Webhook ──
    SePayWebhookPayload:
      type: object
      properties:
        id:
          type: number
          description: SePay transaction ID (used for idempotency)
        bankBrandName:
          type: string
        accountNumber:
          type: string
        transactionDate:
          type: string
        amountIn:
          type: number
        amountOut:
          type: number
        accumulated:
          type: number
          nullable: true
        code:
          type: string
          nullable: true
        content:
          type: string
        transferType:
          type: string
          enum: [in, out]
        referenceCode:
          type: string
          nullable: true
        description:
          type: string
      required: [id, bankBrandName, accountNumber, transactionDate, amountIn, amountOut, content, transferType]

    WebhookResponse:
      type: object
      properties:
        success:
          type: boolean
        status:
          type: string
          enum: [matched, unmatched, duplicate, error]
        message:
          type: string
        order_id:
          type: string
          nullable: true
      required: [success, status, message]

    # ── Reports ──
    PaymentReport:
      type: object
      properties:
        id:
          type: string
        order_id:
          type: string
          nullable: true
        transaction_id:
          type: string
          nullable: true
        bill_image_url:
          type: string
        cloudinary_public_id:
          type: string
        uploaded_by_telegram_id:
          type: number
          nullable: true
        note:
          type: string
          nullable: true
        created_at:
          type: string
      required: [id, bill_image_url, cloudinary_public_id, created_at]

    ReportListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: "#/components/schemas/PaymentReport"
        pagination:
          $ref: "#/components/schemas/Pagination"
      required: [success, data]

    # ── Shared ──
    Pagination:
      type: object
      properties:
        page:
          type: number
        limit:
          type: number
        total:
          type: number
        totalPages:
          type: number
      required: [page, limit, total, totalPages]
